<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscador con Mapa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
}

header{
    background:#0078d7;
    color:white;
    padding:12px;
}

.contenedor{
    display:flex;
    height:calc(100vh - 55px);
}

.panel{
    width:35%;
    overflow:auto;
    padding:15px;
    border-right:1px solid #ccc;
}

#map{
    flex:1;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    margin-bottom:10px;
    box-sizing:border-box;
}

.info{
    margin-bottom:10px;
    color:#0078d7;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f0f0f0;
    position:sticky;
    top:0;
}

th,td{
    border:1px solid #ddd;
    padding:6px;
    font-size:12px;
    text-align:left;
}

tr:hover{
    background:#f7f7f7;
}

.btnEliminar{
    background:#dc3545;
    color:white;
    border:none;
    padding:5px 8px;
    border-radius:4px;
    cursor:pointer;
}

.btnEliminar:hover{
    background:#bd2130;
}
</style>
</head>

<body>

<header>
<h2>Consulta Geográfica</h2>
</header>

<div class="contenedor">

<div class="panel">

<input
type="text"
id="txtBuscar"
placeholder="Buscar por Nombre o Descripción">

<div class="info">
Resultados: <span id="contador">0</span>
</div>

<table>

<thead>
<tr>
<th>Nombre</th>
<th>Distancia</th>
<th>Descripción</th>
<th></th>
</tr>
</thead>

<tbody id="tablaResultados"></tbody>

</table>

</div>

<div id="map"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let datos = [];
let resultados = [];
let marcadores = [];

const map = L.map('map').setView([4.6,-74.1],6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);

// Cargar CSV
Papa.parse("datos.csv",{
    download:true,
    header:true,
    skipEmptyLines:true,

    complete:function(response){

        datos = response.data;
        resultados = [...datos];

        renderizarTabla();
        actualizarMapa();
    }
});

// Búsqueda en tiempo real
document
.getElementById("txtBuscar")
.addEventListener("input", filtrar);

function filtrar(){

    let texto =
    document.getElementById("txtBuscar")
    .value
    .toLowerCase()
    .trim();

    resultados = datos.filter(item => {

        let nombre =
        (item.Nombre || "")
        .toLowerCase();

        let descripcion =
        (item.Descripción || "")
        .toLowerCase();

        return nombre.includes(texto)
            || descripcion.includes(texto);

    });

    renderizarTabla();
    actualizarMapa();

}

function renderizarTabla(){

    const tbody =
    document.getElementById("tablaResultados");

    tbody.innerHTML="";

    resultados.forEach((item,index)=>{

        const fila =
        document.createElement("tr");

        fila.innerHTML=`
            <td>${item.Nombre}</td>
            <td>${item.Distancia}</td>
            <td>${item.Descripción}</td>
            <td>
                <button
                class="btnEliminar"
                onclick="quitarResultado(${index})">
                Quitar
                </button>
            </td>
        `;

        tbody.appendChild(fila);

    });

    document.getElementById("contador")
    .innerText = resultados.length;

}

function quitarResultado(index){

    resultados.splice(index,1);

    renderizarTabla();
    actualizarMapa();

}

function actualizarMapa(){

    marcadores.forEach(marker=>{
        map.removeLayer(marker);
    });

    marcadores = [];

    let bounds = [];

    resultados.forEach(item=>{

        let lat =
        parseFloat(item.latitud);

        let lng =
        parseFloat(item.longitud);

        if(isNaN(lat) || isNaN(lng))
            return;

        let marker =
        L.marker([lat,lng]).addTo(map);

        marker.bindPopup(`
            <b>${item.Nombre}</b><br>
            Distancia: ${item.Distancia}<br>
            Latitud: ${lat}<br>
            Longitud: ${lng}
        `);

        marcadores.push(marker);

        bounds.push([lat,lng]);

    });

    if(bounds.length>0){

        map.fitBounds(bounds,{
            padding:[40,40]
        });

    }

}

</script>

</body>
</html>
